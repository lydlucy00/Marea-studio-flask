<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ producto.nombre }} | MARESÍA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
        font-family: 'Montserrat', sans-serif; 
        background-color: #d2c9b4; 
        color: #3d352d; 
    }

   /* Cabecera limpia y fija arriba */
        header { background: #c6baa0; padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eae2d0; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.4rem; font-weight: 500; letter-spacing: 3px; color: #2c241d; text-decoration: none; }
        nav a { margin-left: 25px; text-decoration: none; color: #6e6154; font-size: 0.9rem; transition: color 0.3s; }
        nav a:hover { color: #b89768; }
    
    /* Enlaces del menú alineados a la derecha */
    nav a { 
        margin-left: 25px; 
        text-decoration: none; 
        color: #7a6e60; 
        font-size: 0.9rem; 
        transition: color 0.3s;
    }
    nav a:hover { 
        color: #b89768; 
    }

    /* Resto de la estructura de tu página (por ejemplo, el detalle del producto) */
    .product-detail { 
        max-width: 950px; 
        margin: 50px auto; 
        display: flex; 
        gap: 50px; 
        background: #e9e0c9; 
        padding: 40px; 
        border-radius: 12px; 
        box-shadow: 0 6px 20px rgba(61, 53, 45, 0.04); 
        border: 1px solid #cfccc3; 
    }
    .product-detail img { width: 50%; border-radius: 8px; object-fit: cover; max-height: 450px; }
    .info { width: 50%; display: flex; flex-direction: column; justify-content: center; }
    .info h1 { font-size: 2.2rem; margin-bottom: 15px; color: #2c241d; font-weight: 400; font-family: 'Cormorant Garamond', serif; }
    .price { font-size: 1.4rem; color: #b89768; font-weight: 600; margin-bottom: 20px; font-family: sans-serif; }
    .description { font-size: 1.05rem; color: #7a6e60; line-height: 1.7; margin-bottom: 30px; font-family: sans-serif; }
    .btn-buy { padding: 14px; background-color: #b89768; color: white; border: none; border-radius: 30px; font-weight: 500; cursor: pointer; font-size: 1rem; font-family: sans-serif; transition: background 0.3s; letter-spacing: 1px; text-align: center; text-decoration: none; }
    .btn-buy:hover { background-color: #9c7b4c; }
    .back-link { display: inline-block; margin-top: 20px; color: #7a6e60; text-decoration: none; font-family: sans-serif; font-size: 0.95rem; }
    .back-link:hover { color: #b89768; }
</style>
</head>
<body>

    <header>
    <a href="/" class="logo">MAREA STUDIO</a>
    <nav>
    <a href="/">Inicio</a>
    <a href="/#tienda">Colección</a>
    <a href="/contacto">Contacto</a>
    <a href="/carrito">Cesta</a>
</nav>
</header>

    <div class="product-detail">
        <img src="{{ producto.imagen }}" alt="{{ producto.nombre }}">
        <div class="info">
            <h1>{{ producto.nombre }}</h1>
            <p class="price">{{ producto.precio }} €</p>
            <p class="description">{{ producto.descripcion }}</p>

            <a href="/agregar/{{ producto.id }}" class="btn-buy" style="display: block; text-align: center; text-decoration: none;">Añadir al Carrito</a>
        </div>
    </div>

</body>
</html>
